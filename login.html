<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#808080">
  <title>Sign up — StacklyFit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login.css">
</head>
<body>
    <main class="auth-shell">
    <aside class="visual-panel" aria-label="Athlete training">
      <img src="assets/images/hero-strength.jpg" alt="">
      <p class="vq">Better.<br>Stronger.<br>Faster.</p>
    </aside>

    <section class="auth-panel" aria-labelledby="formTitle">
      <div class="auth-content">
        <a class="home-brand" href="index.html">stacklyfit<i>.</i></a>
        <a class="back-home" href="index.html" aria-label="Back to home page"><span aria-hidden="true">&larr;</span> Back to home</a>
        <header class="auth-heading">
          <h1 id="formTitle">Welcome Back</h1>
          <p id="formSubtitle">Sign up to continue to your account</p>
        </header>

        <div class="auth-tabs" role="tablist" aria-label="Account access">
          <button class="tab active" id="signupTab" type="button" role="tab" aria-selected="true">Sign up</button>
          <button class="tab" id="loginTab" type="button" role="tab" aria-selected="false">Log in</button>
        </div>

        <form id="authForm" novalidate>
          <div class="field" id="firstNameField">
            <label class="visually-hidden" for="firstName">First name</label>
            <input id="firstName" name="firstName" type="text" placeholder="First name" autocomplete="given-name">
            <small class="error"></small>
          </div>
          <div class="field" id="lastNameField">
            <label class="visually-hidden" for="lastName">Last name</label>
            <input id="lastName" name="lastName" type="text" placeholder="Last name" autocomplete="family-name">
            <small class="error"></small>
          </div>
          <div class="field">
            <label class="visually-hidden" for="email">Email address</label>
            <input id="email" name="email" type="email" placeholder="Email address" autocomplete="email">
            <small class="error"></small>
          </div>
          <div class="field password-field">
            <label class="visually-hidden" for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="Password" autocomplete="new-password">
            <button class="show-password" id="togglePassword" type="button" aria-label="Show password" title="Show password">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/><path class="slash" d="m4 4 16 16"/></svg>
            </button>
            <small class="error"></small>
          </div>
          <div class="field" id="confirmField">
            <label class="visually-hidden" for="confirmPassword">Confirm password</label>
            <input id="confirmPassword" name="confirmPassword" type="password" placeholder="Confirm password" autocomplete="new-password">
            <small class="error"></small>
          </div>

          <div class="form-options" id="signupOptions">
            <label class="terms"><input type="checkbox" id="terms"><span>I agree to <a href="#terms">Terms &amp; Conditions</a></span></label>
          </div>
          <div class="form-options login-options" id="loginOptions" hidden>
            <label class="terms"><input type="checkbox" id="remember"><span>Remember me</span></label>
            <button class="link-button" type="button" id="forgotButton">Forgot password?</button>
          </div>

          <button class="submit-button" type="submit" id="submitButton" disabled>Create Account</button>
          <p class="switch-copy" id="switchCopy">Already have an account? <button type="button" class="inline-link" id="switchLink">Log in</button></p>
        </form>

        <div class="social-buttons" aria-label="Other sign-up options">
          <button type="button" class="social-button" aria-label="Continue with Google" data-provider="Google"><span class="google-g">G</span></button>
          <button type="button" class="social-button" aria-label="Continue with Microsoft" data-provider="Microsoft"><span class="microsoft-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span></button>
        </div>
        <p class="support-copy"><a href="mailto:support@stacklyfit.fit">Need help? Contact Support</a></p>
        <p class="form-message" id="formMessage" role="status" aria-live="polite"></p>
      </div>
    </section>
  </main>
  <script src="login.js"></script>
</body>
</html>
